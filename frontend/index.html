<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Portfolio Tracker</title>
    <meta name="description" content="Multi-client investment portfolio tracker" />
    <meta name="theme-color" content="#2563eb" />

    <!-- PWA manifest is injected by vite-plugin-pwa (generates manifest.webmanifest) -->

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Portfolio" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Apply the saved theme before first paint so there's no flash of the wrong
         theme on load — ThemeContext re-derives and owns this class after mount. -->
    <script>
      (function () {
        var saved = localStorage.getItem('pref-theme');
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
