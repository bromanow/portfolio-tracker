## Render Infrastructure-as-Code
## Defines: backend API (Python), frontend (static), PostgreSQL database
## Docs: https://render.com/docs/infrastructure-as-code

services:
  # ── Backend API (FastAPI / uvicorn) ──────────────────────────────────────────
  - type: web
    name: portfolio-tracker-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter             # "starter" ($7/mo) avoids cold starts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-tracker-db
          property: connectionString
      # Comma-separated list of frontend origins allowed to call the API.
      # Update this if you use a custom domain for the frontend.
      - key: ALLOWED_ORIGINS
        value: https://portfolio-tracker-ui-crm4.onrender.com
      - key: PYTHON_VERSION
        value: "3.11"
      # JWT signing key — auto-generated by Render, never changes after first deploy
      - key: SECRET_KEY
        generateValue: true
      # Initial admin account — set ADMIN_PASSWORD manually in the Render dashboard
      # (it won't appear here to avoid committing it to git)
      - key: ADMIN_EMAIL
        value: brian@romanow.ca
      - key: ADMIN_NAME
        value: Brian Romanow
      - key: ADMIN_PASSWORD
        sync: false   # set this manually in Render → Environment tab
      # IBeam Client Portal Gateway — internal URL for live option data.
      # Leave empty to disable IBeam and fall back to yfinance.
      - key: IBEAM_BASE_URL
        value: https://ibeam-lmhj:5000

  # ── IBeam — IBKR Client Portal Gateway (headless, containerised) ─────────────
  # Authenticates against IBKR and proxies the Client Portal REST API so the
  # backend can fetch live option chains + Greeks without a local desktop app.
  # Requires ~2 GB RAM (IB Gateway + Chromium). Uses the "standard" plan.
  # Credentials and TOTP secret are set manually in Render → Environment tab.
  #
  # Built from a custom Dockerfile (ibeam/Dockerfile) that extends the stock
  # voyz/ibeam image with a login patch for IBKR's 2FA device-selection dropdown.
  - type: pserv               # private service — not exposed to the internet
    name: ibeam
    runtime: image
    image:
      url: ghcr.io/bromanow/portfolio-tracker-ibeam:latest
    plan: standard            # 2 GB RAM / 1 CPU — required for IB Gateway + Chrome
    envVars:
      - key: IBEAM_ACCOUNT
        sync: false           # set in Render dashboard: your IBKR API sub-username
      - key: IBEAM_PASSWORD
        sync: false           # set in Render dashboard: that user's password
      - key: IBEAM_TWO_FA_HANDLER
        value: pyotp          # automated TOTP — no human interaction needed
      - key: IBEAM_PYOTP_SECRET
        sync: false           # set in Render dashboard: base32 secret from IBKR TOTP setup
      # TOTP input field — ID discovered from live page inspection.
      # patch_login.py handles device selection; IBeam handles TOTP fill natively.
      - key: IBEAM_TWO_FA_EL_ID
        value: ID@@xyz-field-silver-response
      - key: IBEAM_TWO_FA_INPUT_EL_ID
        value: ID@@xyz-field-silver-response
      - key: IBEAM_LOG_LEVEL
        value: INFO
      - key: IBEAM_MAX_FAILED_AUTH
        value: "3"            # stop after 3 failures to avoid IBKR account lockout
      - key: IBEAM_GATEWAY_STARTUP
        value: "30"           # seconds to wait for Gateway to boot on cold start
      - key: IBEAM_KEEP_ALIVE_INTERVAL
        value: "60"           # tickle the session every 60s to prevent expiry
      - key: IBEAM_PAGE_LOAD_TIMEOUT
        value: "60"           # extra time for slow IBKR portal pages

  # ── Frontend (React / Vite — served by Node via "serve") ────────────────────
  # Render Blueprints don't support type:static; we use a lightweight Node web
  # service instead. "npx serve -s dist" serves the built SPA and handles
  # client-side routing via the -s (single-page app) flag.
  - type: web
    name: portfolio-tracker-ui
    runtime: node
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run serve
    plan: free
    envVars:
      # VITE_ vars are baked into the bundle at build time by Vite.
      # Points the React app at the backend service above.
      - key: VITE_API_BASE_URL
        value: https://portfolio-tracker-api-yf4a.onrender.com

# ── PostgreSQL database ───────────────────────────────────────────────────────
databases:
  - name: portfolio-tracker-db
    databaseName: portfolio_tracker
    plan: free                # 256 MB storage, 97-day data retention on free tier
                              # upgrade to "starter" ($7/mo) for 1 GB + 30-day backups
